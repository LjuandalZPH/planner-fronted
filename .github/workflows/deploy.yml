name: CI/CD Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # 'npm ci' es mejor para CI que 'install' porque es más rápido y estricto

      - name: Run Unit Tests
        # Esto ejecutará Vitest en modo "run" (una sola vez, sin modo watch)
        run: npm test -- --run

      - name: Build
        # El build solo se ejecuta si los tests pasaron (paso anterior)
        run: npm run build
        env:
          # Si tu build necesita variables de entorno, agrégalas aquí
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}